{% extends 'base.html' %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h2>Create Account</h2>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="auth-btn">
                Register
            </button>
        </form>

    </div>

</div>

{% endblock %}
